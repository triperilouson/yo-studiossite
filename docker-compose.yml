services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://yo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/yo_store?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      ADMIN_REFRESH_TOKEN_TTL_HOURS: ${ADMIN_REFRESH_TOKEN_TTL_HOURS:-12}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      BUSINESS_NAME: ${BUSINESS_NAME:-YO STUDIOS}
      BUSINESS_TAX_ID: ${BUSINESS_TAX_ID:?BUSINESS_TAX_ID is required}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:?BUSINESS_ADDRESS is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      MAIL_STRICT_DELIVERY: ${MAIL_STRICT_DELIVERY:-false}
      SES_REGION: ${SES_REGION:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      SES_FROM_ORDERS: ${SES_FROM_ORDERS:-}
      SES_FROM_SUPPORT: ${SES_FROM_SUPPORT:-}
      SES_FROM_MARKETING: ${SES_FROM_MARKETING:-}
      SES_FROM_SYSTEM: ${SES_FROM_SYSTEM:-}
      SES_FROM_NAME: ${SES_FROM_NAME:-YO STUDIOS}
      SES_REPLY_TO: ${SES_REPLY_TO:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SUPPORT_INBOUND_WEBHOOK_SECRET: ${SUPPORT_INBOUND_WEBHOOK_SECRET:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      GROW_API_URL: ${GROW_API_URL:-}
      GROW_API_KEY: ${GROW_API_KEY:-}
      GROW_WEBHOOK_SECRET: ${GROW_WEBHOOK_SECRET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_OBJECT_PREFIX: ${R2_OBJECT_PREFIX:-}
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yo_store
      POSTGRES_USER: yo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yo -d yo_store"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
